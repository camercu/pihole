---
# Capture changes made by hand in the admin UI back into this repo's config
# files, so they survive a rebuild:
#   nix-shell --run 'just mirror'   (or: ansible-playbook mirror.yml)
# Reads live Pi-hole state and makes the files it owns under
# ansible/roles/pihole/files/ say what the box holds — entries added in the UI
# appear, entries deleted there go — naming anything the config format cannot
# express. Review with `git diff` before committing; the box is not modified
# either way.
- name: Capture hand-made Pi-hole changes into the config files
  hosts: pihole
  become: true
  tasks:
    - name: Export live Pi-hole state
      ansible.builtin.command:
        cmd: /usr/local/bin/pihole_mirror.py --export
      environment:
        PIHOLE_PASSWORD_FILE: /etc/pihole-secrets/api-password
      register: pihole_state
      changed_when: false

    # Runs on the controller against the repo working tree: the routing rules
    # and the files they write both live here, so a change to how an entry is
    # captured is a repo edit rather than a redeploy. become: false because the
    # files belong to whoever checked the repo out, not to root.
    - name: Merge the exported state into the repo config files
      ansible.builtin.command:
        cmd: >-
          {{ playbook_dir }}/roles/pihole/files/pihole_mirror.py
          --merge - --dir {{ playbook_dir }}/roles/pihole/files
          {{ '--force-prune' if mirror_force_prune | default(false) | bool else '' }}
        stdin: "{{ pihole_state.stdout }}"
      delegate_to: localhost
      become: false
      register: pihole_mirror
      changed_when: "'CHANGED' in pihole_mirror.stdout"
      failed_when: false

    # Printed before the failure below, so the warnings explaining what could
    # not be captured are readable rather than buried in a task error dump.
    - name: Show what was captured
      ansible.builtin.debug:
        msg: "{{ (pihole_mirror.stdout_lines + pihole_mirror.stderr_lines) | select | list }}"

    # 0 = everything captured, 4 = the rest is only what the config format
    # cannot express. Both pass: the capture worked, files were written, and an
    # unexpressible setting has no fix — failing on it would leave `just mirror`
    # red for good over a decision already made, on a run that changed the
    # working tree. verify.yml draws the same line for the same reason. 5 fails
    # because it does have a fix, and 1 and 2 are the run not finishing.
    - name: Fail when the capture could not be trusted
      ansible.builtin.fail:
        msg: >-
          The mirror declined to capture some deletions, or it could not run
          (exit {{ pihole_mirror.rc }}). See above: deploy the committed files
          first, or re-run as `just mirror force=true` if everything really
          was deleted.
      when: pihole_mirror.rc not in [0, 4]

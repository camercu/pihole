---
- name: Install Pi-hole runtime dependencies
  ansible.builtin.apt:
    name:
      - curl
      - sqlite3
    state: present

- name: Check whether Pi-hole is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/pihole
  register: pihole_bin

# FTL runs as user 'pihole' and mutates gravity.db through the API (groups,
# clients, adlists). For each write SQLite must create a rollback journal *in
# this directory*, so /etc/pihole itself — not just the .db file — has to be
# owned by pihole, or every API write fails "attempt to write a readonly
# database". On a fresh box the 'pihole' user doesn't exist until the installer
# runs below, so bootstrap root-owned (enough to pre-seed setupVars); the
# installer then hands ownership to pihole. On an existing box this asserts
# pihole ownership every run, repairing a box an earlier root:root run clobbered.
- name: Ensure /etc/pihole exists and is FTL-writable
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: "{{ 'pihole' if pihole_bin.stat.exists else 'root' }}"
    group: "{{ 'pihole' if pihole_bin.stat.exists else 'root' }}"
    mode: "0755"

- name: Pre-seed setupVars for unattended install
  ansible.builtin.template:
    src: setupVars.conf.j2
    dest: /etc/pihole/setupVars.conf
    owner: root
    group: root
    mode: "0644"
  when: not pihole_bin.stat.exists

- name: Download Pi-hole installer
  ansible.builtin.get_url:
    url: https://install.pi-hole.net
    dest: /tmp/pihole-install.sh
    mode: "0755"
  when: not pihole_bin.stat.exists

- name: Run Pi-hole unattended install
  ansible.builtin.command:
    cmd: bash /tmp/pihole-install.sh --unattended
  environment:
    PIHOLE_SKIP_OS_CHECK: "true"
  when: not pihole_bin.stat.exists
  changed_when: true

# Pi-hole v6 stores upstreams in pihole.toml. Read first, then set only when it
# differs, so change reporting is honest and a genuine failure isn't swallowed.
- name: Read current Pi-hole upstream
  ansible.builtin.command:
    cmd: pihole-FTL --config dns.upstreams
  register: pihole_ftl_upstream
  changed_when: false

- name: Point Pi-hole upstream at local unbound (v6)
  ansible.builtin.command:
    cmd: >-
      pihole-FTL --config dns.upstreams
      '["{{ pihole_dns_upstream }}"]'
  when: pihole_dns_upstream not in pihole_ftl_upstream.stdout
  changed_when: true

- name: Set Pi-hole web admin password
  ansible.builtin.command:
    cmd: pihole setpassword "{{ pihole_web_password }}"
  when: pihole_web_password | length > 0
  no_log: true
  changed_when: true

- name: Ensure managed list-config directory exists
  ansible.builtin.file:
    path: /etc/pihole/managed
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy list config (adlists, allowlist, allowlist URLs)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/pihole/managed/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - adlists.txt
    - allow.list
    - allowlist-urls.txt

# One subdirectory per Pi-hole group (e.g. groups/kids/); the reconciler
# discovers them under PIHOLE_DIR and scopes each group's block lists + clients.
- name: Deploy per-group config tree
  ansible.builtin.copy:
    src: groups/
    dest: /etc/pihole/managed/groups/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

# Both scripts keep their module filenames because the mirror imports the
# reconciler for the ownership contract they share ("managed by ansible", the
# default-group rule), and Python only imports a module whose filename is an
# identifier. They land in the same directory so that import resolves.
- name: Deploy list reconciler and mirror
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - pihole_deploy.py
    - pihole_mirror.py

# A rename does not delete what it replaced, so an old copy would sit in PATH
# still working while the repo described a name that had moved on.
- name: Remove the scripts' former paths
  ansible.builtin.file:
    path: "/usr/local/bin/{{ item }}"
    state: absent
  loop:
    - pihole-sync-lists.py # before the filename had to be importable
    - pihole_harvest.py # before the name said it writes in both directions

# The API password goes to a root-only file, not the reconciler's environment.
# Passing it via environment: would leak it in Ansible output at -vvv and in
# /proc/<pid>/environ, and forces no_log on the run — which hid the reconcile's
# own errors. A file keeps the secret out of both, so the run below needs no
# no_log and its diagnostics stay visible.
- name: Create secrets directory
  ansible.builtin.file:
    path: /etc/pihole-secrets
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write API password to a root-only file
  ansible.builtin.copy:
    content: "{{ pihole_web_password }}"
    dest: /etc/pihole-secrets/api-password
    owner: root
    group: root
    mode: "0600"
  no_log: true # the password itself

# Reconciles adlists/allowlists into Pi-hole via the FTL REST API (adds missing,
# removes ours no longer in config), then rebuilds gravity only if adlists
# changed. Idempotent: prints CHANGED only when it altered something. No secret
# in this task (password read from the file above), so no no_log — the run's
# CHANGED/error output stays visible.
- name: Reconcile Pi-hole lists via API
  ansible.builtin.command:
    cmd: /usr/local/bin/pihole_deploy.py
  environment:
    PIHOLE_PASSWORD_FILE: /etc/pihole-secrets/api-password
    PIHOLE_DIR: /etc/pihole/managed
  register: pihole_sync
  changed_when: "'CHANGED' in pihole_sync.stdout"

- name: Enable and start Pi-hole FTL
  ansible.builtin.systemd_service:
    name: pihole-FTL
    enabled: true
    state: started

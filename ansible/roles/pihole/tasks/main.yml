---
- name: Install Pi-hole runtime dependencies
  ansible.builtin.apt:
    name:
      - curl
      - sqlite3
    state: present

- name: Check whether Pi-hole is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/pihole
  register: pihole_bin

- name: Ensure /etc/pihole exists
  ansible.builtin.file:
    path: /etc/pihole
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pre-seed setupVars for unattended install
  ansible.builtin.template:
    src: setupVars.conf.j2
    dest: /etc/pihole/setupVars.conf
    owner: root
    group: root
    mode: "0644"
  when: not pihole_bin.stat.exists

- name: Download Pi-hole installer
  ansible.builtin.get_url:
    url: https://install.pi-hole.net
    dest: /tmp/pihole-install.sh
    mode: "0755"
  when: not pihole_bin.stat.exists

- name: Run Pi-hole unattended install
  ansible.builtin.command:
    cmd: bash /tmp/pihole-install.sh --unattended
  environment:
    PIHOLE_SKIP_OS_CHECK: "true"
  when: not pihole_bin.stat.exists
  changed_when: true

# NOTE (verify on first real apply): Pi-hole v6 stores upstreams in pihole.toml,
# not setupVars. This enforces unbound as the sole upstream on existing installs.
# Confirm the FTL config key/CLI on your box; adjust if the command differs.
- name: Point Pi-hole upstream at local unbound (v6)
  ansible.builtin.command:
    cmd: >-
      pihole-FTL --config dns.upstreams
      '["{{ pihole_dns_upstream }}"]'
  register: pihole_ftl_upstream
  changed_when: '"127.0.0.1" not in pihole_ftl_upstream.stdout | default("")'
  failed_when: false

- name: Set Pi-hole web admin password
  ansible.builtin.command:
    cmd: pihole setpassword "{{ pihole_web_password }}"
  when: pihole_web_password | length > 0
  no_log: true
  changed_when: true

- name: Ensure managed list-config directory exists
  ansible.builtin.file:
    path: /etc/pihole/managed
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy list config (adlists, allowlist, allowlist URLs)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/pihole/managed/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - adlists.txt
    - allow.list
    - allowlist-urls.txt

- name: Deploy list reconciler
  ansible.builtin.copy:
    src: pihole-sync-lists.py
    dest: /usr/local/bin/pihole-sync-lists.py
    owner: root
    group: root
    mode: "0755"

# Reconciles adlists/allowlists into Pi-hole via the FTL REST API (adds missing,
# removes ours no longer in config), then rebuilds gravity only if adlists
# changed. Idempotent: prints CHANGED only when it altered something.
- name: Reconcile Pi-hole lists via API
  ansible.builtin.command:
    cmd: /usr/local/bin/pihole-sync-lists.py
  environment:
    PIHOLE_PASSWORD: "{{ pihole_web_password }}"
    PIHOLE_DIR: /etc/pihole/managed
  register: pihole_sync
  changed_when: "'CHANGED' in pihole_sync.stdout"
  no_log: true # PIHOLE_PASSWORD in the environment

- name: Enable and start Pi-hole FTL
  ansible.builtin.systemd_service:
    name: pihole-FTL
    enabled: true
    state: started

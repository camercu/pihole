---
# Failure alerting for the scheduled jobs. Deploys a notifier plus a templated
# OnFailure= handler unit; the maintenance and backup services reference it as
# notify-failure@%n.service so a failed run is never silent.

- name: Create alerting config directory
  ansible.builtin.file:
    path: /etc/pihole-alerting
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy alerting environment file
  ansible.builtin.template:
    src: alerting-env.j2
    dest: /etc/pihole-alerting/env
    owner: root
    group: root
    mode: "0600"
  no_log: true # the webhook URL may embed a token

- name: Deploy failure-notify script
  ansible.builtin.copy:
    src: notify_failure.py
    dest: /usr/local/bin/notify-failure.py
    owner: root
    group: root
    mode: "0755"

- name: Deploy failure-notify handler unit
  ansible.builtin.template:
    src: notify-failure@.service.j2
    dest: /etc/systemd/system/notify-failure@.service
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd so it sees the new handler unit
  ansible.builtin.systemd_service:
    daemon_reload: true

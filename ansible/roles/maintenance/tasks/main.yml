---
# Scheduled upkeep, ported from the original crontab.root. Kept as cron (not
# systemd timers) to stay close to the working setup; the cron module is
# idempotent and self-documenting via the name/comment.

- name: Nightly gravity (blocklist) refresh
  ansible.builtin.cron:
    name: pihole gravity refresh
    minute: "0"
    hour: "3"
    user: root
    job: /usr/local/bin/pihole -g

- name: Refresh unbound root hints
  ansible.builtin.cron:
    name: unbound root hints refresh
    minute: "15"
    hour: "3"
    user: root
    job: /usr/bin/wget https://www.internic.net/domain/named.root -qO /var/lib/unbound/root.hints

# OS security patches are handled by unattended-upgrades (below), NOT a cron
# full-upgrade — security-only is safer than pulling every package unattended,
# and unattended-upgrades self-locks so it won't collide with other apt jobs.
- name: Remove the old cron full-upgrade (superseded by unattended-upgrades)
  ansible.builtin.cron:
    name: apt full-upgrade
    user: root
    state: absent

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable periodic security updates
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Daily Pi-hole self-update
  ansible.builtin.cron:
    name: pihole self update
    minute: "0"
    hour: "7"
    user: root
    job: /usr/local/bin/pihole -up

- name: Weekly reboot (Friday)
  ansible.builtin.cron:
    name: weekly reboot
    minute: "45"
    hour: "3"
    weekday: FRI
    user: root
    job: /sbin/reboot

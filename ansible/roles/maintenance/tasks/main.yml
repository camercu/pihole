---
# OS security patches via unattended-upgrades; recurring upkeep via systemd
# timers (Persistent=true catches up jobs missed while the Pi was powered off,
# which cron cannot do). Replaces the original crontab.root entirely.

- name: Install unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Enable periodic security updates
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Remove superseded root cron jobs
  ansible.builtin.cron:
    name: "{{ item }}"
    user: root
    state: absent
  loop:
    - pihole gravity refresh
    - unbound root hints refresh
    - pihole self update
    - weekly reboot
    - apt full-upgrade

- name: Deploy maintenance service units
  ansible.builtin.template:
    src: maintenance.service.j2
    dest: "/etc/systemd/system/maint-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ maintenance_jobs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy maintenance timer units
  ansible.builtin.template:
    src: maintenance.timer.j2
    dest: "/etc/systemd/system/maint-{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ maintenance_jobs }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable and start maintenance timers
  ansible.builtin.systemd_service:
    name: "maint-{{ item.name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ maintenance_jobs }}"
  loop_control:
    label: "{{ item.name }}"

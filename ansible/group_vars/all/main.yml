---
# ─────────────────────────────────────────────────────────────────────────────
# Site facts + cross-role interface. Role-internal tunables live in each role's
# defaults/main.yml; this file holds what the *site* is (identity, network,
# secrets interface) and any var used by more than one role.
# (Per-user overrides: the gitignored local.yml / vault.yml alongside.)
# ─────────────────────────────────────────────────────────────────────────────

# --- host identity ---------------------------------------------------------
pihole_hostname: pihole
system_timezone: America/New_York
system_locale: en_US.UTF-8

# SSH public keys authorised for the ansible_user — installed by `common`, read
# by `hardening` to decide whether to enforce key-only SSH. Per-user, so the
# real value lives in the gitignored local.yml (written by ./setup.sh).
authorized_ssh_keys: []

# LAN hosts written to /etc/hosts. First name token is canonical; rest aliases.
lan_hosts:
  - ip: 192.168.0.1
    names: [router, router.home.arpa]
  - ip: 192.168.0.2
    names: [pihole, pi.hole, pihole.home.arpa]
  - ip: 192.168.0.11
    names: [jcu-nas2, jcu-nas2.home.arpa]

# --- cross-role interface --------------------------------------------------
# Local unbound endpoint — served by `unbound`, forwarded to by `pihole`.
unbound_listen_address: 127.0.0.1
unbound_listen_port: 5335 # Pi-hole's documented default unbound port

# Web admin / API password — set by `pihole`, used by `backup` for the API.
# The real value is encrypted in vault.yml as vault_pihole_web_password (see
# README "Secrets"); undefined => the admin password is left unset.
pihole_web_password: "{{ vault_pihole_web_password | default('') }}"

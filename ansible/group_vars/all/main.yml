---
# ─────────────────────────────────────────────────────────────────────────────
# Cross-role interface — values used by more than one role and NOT meant to be
# overridden per-site. Role-internal tunables live in each role's
# defaults/main.yml; generic per-site facts (identity, LAN hosts, timezone) live
# in defaults.yml alongside, overridden by the gitignored local.yml. They are
# kept out of *this* file on purpose: group_vars/all load alphabetically, so
# main.yml would override local.yml (defaults.yml, sorting first, does not).
# ─────────────────────────────────────────────────────────────────────────────

# --- cross-role interface --------------------------------------------------
# Local unbound endpoint — served by `unbound`, forwarded to by `pihole`.
unbound_listen_address: 127.0.0.1
unbound_listen_port: 5335 # Pi-hole's documented default unbound port

# Web admin / API password — set by `pihole`, used by `backup` for the API.
# The real value is encrypted in vault.yml as vault_pihole_web_password (see
# README "Secrets"); undefined => the admin password is left unset.
pihole_web_password: "{{ vault_pihole_web_password | default('') }}"

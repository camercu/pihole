---
# The one Pi. Connection details (ansible_host, ansible_user, ssh key) are
# per-user and live in the gitignored group_vars/all/local.yml, which ./setup.sh
# generates on first run. See group_vars/all/local.yml.example.
all:
  children:
    pihole:
      hosts:
        pi:
          ansible_python_interpreter: /usr/bin/python3

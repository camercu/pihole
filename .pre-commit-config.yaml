# Commit gate: the same `just` recipes CI runs (.github/workflows/ci.yml), so
# a commit that passes here passes CI's lint + unit-test job. The justfile is
# the one definition; these hooks only call it. Local binaries from the nix env
# (no hook envs downloaded). shell.nix installs the hook on entering the env.
# Run manually: `pre-commit run --all-files`.
repos:
  - repo: local
    hooks:
      - id: lint
        name: just lint (ruff + ansible-lint)
        entry: just lint
        language: system
        files: \.(py|ya?ml)$
        pass_filenames: false

      - id: test
        name: just test (unit tests)
        entry: just test
        language: system
        types: [python]
        pass_filenames: false

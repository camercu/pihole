## DNS Over TLS, Simple ENCRYPTED recursive caching DNS, TCP port 853
# Modified from sources:
# https://docs.pi-hole.net/guides/dns/unbound/
# https://bartonbytes.com/posts/configure-pi-hole-for-dns-over-tls/

server:
    # If no logfile is specified, syslog is used
    logfile: "/var/log/unbound/unbound.log"
    log-time-ascii: yes
    verbosity: 1

    interface: 127.0.0.1
    port: 5553
    do-ip4: yes     # listen and request on ipv4
    do-ip6: yes     # listen and request on ipv6
    do-udp: yes     # listen and request on udp
    do-tcp: yes     # listen and request on tcp

    # Use DNS over TLS for upstream queries
    ssl-upstream: yes

    # You want to leave this to no unless you have *native* IPv6. With 6to4 and
    # Terredo tunnels your web browser should favor IPv4 for the same reasons
    prefer-ip6: no

    access-control: 127.0.0.0/8 allow

    # Use this only when you downloaded the list of primary root servers!
    # If you use the default dns-root-data package, unbound will find it automatically
    root-hints: "/var/lib/unbound/root.hints"

    # Trust glue only if it is within the server's authority
    harden-glue: yes

    # Require DNSSEC data for trust-anchored zones, if such data is absent, the zone becomes BOGUS
    harden-dnssec-stripped: yes

    # Don't use Capitalization randomization as it known to cause DNSSEC issues sometimes
    # see https://discourse.pi-hole.net/t/unbound-stubby-or-dnscrypt-proxy/9378 for further details
    use-caps-for-id: no

    # Reduce EDNS reassembly buffer size.
    # IP fragmentation is unreliable on the Internet today, and can cause
    # transmission failures when large DNS messages are sent via UDP. Even
    # when fragmentation does work, it may not be secure; it is theoretically
    # possible to spoof parts of a fragmented DNS message, without easy
    # detection at the receiving end. Recently, there was an excellent study
    # >>> Defragmenting DNS - Determining the optimal maximum UDP response size for DNS <<<
    # by Axel Koolhaas, and Tjeerd Slokker (https://indico.dns-oarc.net/event/36/contributions/776/)
    # in collaboration with NLnet Labs explored DNS using real world data from the
    # the RIPE Atlas probes and the researchers suggested different values for
    # IPv4 and IPv6 and in different scenarios. They advise that servers should
    # be configured to limit DNS messages sent over UDP to a size that will not
    # trigger fragmentation on typical network links. DNS servers can switch
    # from UDP to TCP when a DNS response is too big to fit in this limited
    # buffer size. This value has also been suggested in DNS Flag Day 2020.
    edns-buffer-size: 1232

    # Perform prefetching of close to expired message cache entries
    # This only applies to domains that have been frequently queried
    prefetch: yes

    # One thread should be sufficient, can be increased on beefy machines.
    # In reality for most users running on small networks or on a single
    # machine, it should be unnecessary to seek performance enhancement by
    # increasing num-threads above 1.
    num-threads: 1

    # Ensure kernel buffer is large enough to not lose messages in traffic spikes
    so-rcvbuf: 1m

    # Ensure privacy of local IP ranges
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10

    hide-identity: yes      # refuse id.server and hostname.bind queries
    hide-version: yes       # refuse version.server and version.bind queries

    # default cache max ttl is 24 hrs
    # default min cache ttl is 0 secs
    # cache-max-ttl: 14400    # 4 hrs
    # cache-min-ttl: 600      # 10 mins

    # Send minimum amount of information to upstream servers to enhance
    # privacy. Only sends minimum required labels of the QNAME and sets
    # QTYPE to NS when possible.
    # See RFC 7816 "DNS Query Name Minimisation to Improve Privacy" for
    # details.
    qname-minimisation: yes

    # If yes, Unbound doesn't insert authority/additional sections into
    # response messages when those sections are not required. This reduces
    # response size significantly, and may avoid TCP fallback for some
    # responses. This may cause a slight speedup. The default is no, because
    # the DNS protocol RFCs mandate these sections, and the additional content
    # could be of use and save roundtrips for clients.
    minimal-responses: yes
    # If yes, message cache elements are prefetched before they expire to keep
    # the cache up to date. Default is no. Turning it on gives about 10 percent
    # more traffic and load on the machine, but popular items do not expire
    # from the cache.
    prefetch: yes

    forward-zone:
        name: "."
            forward-addr: 1.1.1.3@853         # cloudflare families DoT primary
            forward-addr: 1.0.0.3@853         # cloudflare families DoT secondary
            forward-addr: 9.9.9.9@853         # quad9 DoT primary
            forward-addr: 149.112.112.112@853 # quad9 DoT secondary
            forward-addr: 8.8.8.8@853         # google DoT primary
            forward-addr: 8.8.4.4@853         # gootle DoT secondary


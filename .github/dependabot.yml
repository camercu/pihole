version: 2
updates:
  # Keep the CI workflow's actions current (e.g. checkout, install-nix-action).
  # Grouped into one PR/week to keep the noise down.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
